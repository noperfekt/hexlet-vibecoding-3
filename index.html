<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Александер — вайбкодер</title>
  <meta name="description" content="Делаю простые и аккуратные сайты. HTML, CSS, JavaScript.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:url" content="https://noperfekt.github.io/hexlet-vibecoding-3/">
  <meta property="og:title" content="Александер — вайбкодер">
  <meta property="og:description" content="Делаю простые и аккуратные сайты. HTML, CSS, JavaScript.">
  <meta property="og:image" content="https://noperfekt.github.io/hexlet-vibecoding-3/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему"></button>
  <main class="card">
    <div class="avatar">А</div>
    <h1>Александер</h1>
    <p class="role">Вайбкодер</p>
    <p class="about">Делаю простые и аккуратные сайты. Люблю чистый код и удобные интерфейсы.</p>
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
    <nav class="links">
      <a href="mailto:ivan@example.com">Email</a>
      <a href="https://github.com/">GitHub</a>
      <a href="https://t.me/">Telegram</a>
    </nav>
  </main>
  <script>
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    function render() {
      btn.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
    }
    btn.addEventListener('click', function () {
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
      render();
    });
    render();
  </script>
</body>
</html>
